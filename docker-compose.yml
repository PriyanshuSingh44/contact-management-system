services:

  # ── Contact Management System (Streamlit App) ─────────────────────────────
  cms:
    image: contact-management-system:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - contacts_data:/app/data    # named volume → /app/data/contacts.json is persisted
      - photos_data:/app/photos    # named volume → /app/photos/ dir is persisted
    environment:
      - PYTHONUNBUFFERED=1
      - CONTACTS_FILE=/app/data/contacts.json
      - PHOTOS_DIR=/app/photos
    restart: unless-stopped

  # ── Jenkins CI/CD Server ──────────────────────────────────────────────────
  jenkins:
    image: jenkins-with-docker:latest   # jenkins:lts + Docker CLI (built once)
    container_name: jenkins-container
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home             # saves all Jenkins settings and jobs
      - /var/run/docker.sock:/var/run/docker.sock  # lets Jenkins run docker commands
    restart: unless-stopped
    user: root

volumes:
  contacts_data:   # persists contacts.json across restarts/rebuilds
  photos_data:     # persists uploaded photos across restarts/rebuilds
  jenkins_home:    # persists Jenkins config, jobs, build history, installed plugins